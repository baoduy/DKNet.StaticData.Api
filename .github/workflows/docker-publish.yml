name: Publish Docker Image
on:
  push:
    branches: [main]
permissions:
  contents: write
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  Project_Path: ApiEndpoints/DKNet.StaticData.Api/DKNet.StaticData.Api.csproj
  Client_Project_Path: ApiEndpoints/DKNet.StaticData.Client/DKNet.StaticData.Client.csproj
  Image_Repository: baoduy/dknet.staticdata-api
jobs:
  publish-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Calculate version
        id: version
        uses: paulhatch/semantic-version@v6.0.2
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: false

      - name: Set NEXT_VERSION
        run: echo "NEXT_VERSION=${{ steps.version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ContainerRuntimeIdentifiers replaces --runtime: the SDK builds one image per RID
      # and pushes a manifest list, so each tag serves amd64 and arm64 hosts.
      - name: Build & push image
        run: |
          dotnet publish ${{ env.Project_Path }} \
            --configuration Release \
            --self-contained false \
            /t:PublishContainer \
            -p:ContainerRuntimeIdentifiers='"linux-x64;linux-arm64"' \
            -p:ContainerBaseImage=mcr.microsoft.com/dotnet/aspnet:10.0 \
            -p:ContainerUser=1654 \
            -p:ContainerRegistry=ghcr.io \
            -p:ContainerRepository=${{ env.Image_Repository }} \
            -p:ContainerImageTags='"${{ env.NEXT_VERSION }};latest"'

      - name: Verify both image tags and architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in "$NEXT_VERSION" latest; do
            docker manifest inspect "ghcr.io/$Image_Repository:$tag" > manifest.json
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' manifest.json
          done
      - name: Pack NuGet package
        run: |
          dotnet pack ${{ env.Client_Project_Path }} \
            --configuration Release \
            -p:PackageVersion=${{ env.NEXT_VERSION }} \
            -o ./nupkgs

      - name: Push NuGet package to GitHub Packages
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Release tag
        uses: softprops/action-gh-release@v3.0.1
        with:
          generate_release_notes: true
          make_latest: true
          tag_name: v${{ env.NEXT_VERSION }}
      - name: Summary
        run: |
          echo "Pushed ghcr.io/${{ env.Image_Repository }}:${{ env.NEXT_VERSION }} and :latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed DKNet.StaticData.Client ${{ env.NEXT_VERSION }} to GitHub Packages" >> "$GITHUB_STEP_SUMMARY"
